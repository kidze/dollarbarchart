<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="dbc-build" content="">
<title>dollar bars</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<header id="top">
  <button id="tick" class="tb" title="Symbol search (press /)"><span id="tName">…</span><small id="tSub"></small></button>
  <button id="star" class="tb icon" title="Add to / remove from the watchlist (downloaded in the background while the app is open)">☆</button>
  <i class="sep"></i>
  <div class="seg"><button id="bDollar" class="on">Dollar bars</button><button id="bTime">Time bars</button></div>
  <label id="lSize">size <select id="size"></select></label>
  <label id="lTf" style="display:none">timeframe <select id="tf"></select></label>
  <i class="sep"></i>
  <span class="btns">
    <button id="bInd" class="tb" title="Indicators: lines computed from the bars, switched on or off here"><svg viewBox="0 0 28 28"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 21.5c6.5-.5 9-3 11.5-8S20.5 6 23 5.5"/><path d="M5 24.5h18" stroke-dasharray="1.5 3"/></g></svg>Indicators</button>
    <button id="bUndo" class="tb icon" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 28 28"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M9.5 9.5H17a5.5 5.5 0 0 1 0 11h-5M12.5 6 9 9.5l3.5 3.5"/></svg></button>
    <button id="bRedo" class="tb icon" title="Redo (Ctrl+Y)" disabled><svg viewBox="0 0 28 28"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M18.5 9.5H11a5.5 5.5 0 0 0 0 11h5M15.5 6 19 9.5 15.5 13"/></svg></button>
    <button id="bSettings" class="tb icon" title="Chart settings"><svg viewBox="0 0 28 28"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="14" cy="14" r="3.2"/><path d="M14 4.5l1.6 2.6 3-.6.9 2.9 2.8 1.2-.8 2.9 2 2.3-2.2 2 .6 3-2.9.8-1.3 2.8-2.9-.9L14 23.5l-1.8-2.5-2.9.9-1.3-2.8-2.9-.8.6-3-2.2-2 2-2.3-.8-2.9 2.8-1.2.9-2.9 3 .6z"/></g></svg></button>
  </span>
  <span id="unsaved"></span>
  <div id="status"><i></i><span>connecting…</span></div>
</header>
<div id="sub">
  <div id="prog"><span id="progText"></span><div class="bar"><i id="progFill"></i></div><span id="progPct"></span></div>
  <div id="stats"></div>
</div>
<main>
  <nav id="tools">
    <button data-tool="cursor" class="on" title="Cross (Esc)"><svg viewBox="0 0 28 28"><path fill="currentColor" d="M13.5 4h1v9.5H24v1h-9.5V24h-1v-9.5H4v-1h9.5z"/></svg></button>
    <button data-tool="trendline" title="Trend line (Alt+T) · hold Shift for a horizontal line"><svg viewBox="0 0 28 28"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8.2 19.8 19.8 8.2"/><circle cx="6.5" cy="21.5" r="2.3"/><circle cx="21.5" cy="6.5" r="2.3"/></g></svg></button>
    <i class="hsep"></i>
    <button id="tStay" title="Stay in drawing mode: keep the tool after placing a line"><svg viewBox="0 0 28 28"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M17.5 6.5l4 4L11 21H7v-4z"/><path d="M15 9l4 4"/><path d="M5 24h18" stroke-dasharray="2 2"/></g></svg></button>
    <button id="tLock" title="Lock all drawings"><svg viewBox="0 0 28 28"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="8" y="13" width="12" height="9" rx="1.5"/><path d="M10.5 13V10a3.5 3.5 0 0 1 7 0v3"/></g></svg></button>
    <button id="tHide" title="Hide all drawings"><svg viewBox="0 0 28 28"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 14s3.8-6.5 10-6.5S24 14 24 14s-3.8 6.5-10 6.5S4 14 4 14z"/><circle cx="14" cy="14" r="3.2"/><path class="slash" d="M6 22 22 6"/></g></svg></button>
    <button id="tRemove" title="Remove all drawings on this chart"><svg viewBox="0 0 28 28"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7 9h14M11.5 9V6.5h5V9M9 9l1 13h8l1-13M12.5 12.5v6.5M15.5 12.5v6.5"/></g></svg></button>
  </nav>
  <div id="wrap">
    <div id="chart"></div>
    <div id="legend"><div id="lgBar">hover a bar</div><div id="lgInd"></div></div>
    <div id="empty"></div>
    <div id="axis"><button id="bAuto" title="Auto scale (double-click the price axis does the same)">A</button><button id="bLog" title="Logarithmic price scale">L</button></div>
    <div id="banner"><span id="bannerText"></span><button id="bannerBtn">Update now</button></div>
    <div id="dtb"></div>
    <div id="picker" class="overlay"><div id="pbox"><input id="q" placeholder="Type a ticker: BTC, PUMP, HYPE, NVDA…  (Enter = the market with the most history)" autocomplete="off" spellcheck="false"><div id="res"></div></div></div>
  </div>
</main>
<footer id="foot"></footer>
<div id="boot"></div>
<script src="lightweight-charts.js"></script>
<script src="static/ui.js"></script>
<script src="static/settings.js"></script>
<script src="static/draw.js"></script>
<script src="static/indicators.js"></script>
<script src="static/window.js"></script>
<script src="static/app.js"></script>
<script>
  // The page and its scripts come from disk, the server that answers may be older (the app was reopened after an update was
  // pulled but before "Update now"): then static/ is missing. Ask that server to restart onto the new files and reload.
  if (!window.DBCApp) (function(){
    var b = document.getElementById('boot');                     // styled inline: static/app.css may be missing too
    b.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0c0e;color:#a8adb8;font:18px Segoe UI,sans-serif';
    b.textContent = 'Finishing an update: restarting the chart server…';
    var pid = null, t0 = Date.now();
    (function ask(){
      fetch('/restart').then(function(r){ return r.json(); }).then(function(j){ if (j.ok) pid = j.pid; }).catch(function(){})
        .then(function(){ if (pid === null && Date.now() - t0 < 120000) setTimeout(ask, 5000); });
    })();
    var iv = setInterval(function(){
      fetch('/ping', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
        if (j.ok && pid !== null && j.pid !== pid) { clearInterval(iv); location.reload(); }
      }).catch(function(){});
      if (Date.now() - t0 > 150000) { clearInterval(iv); b.textContent = 'The chart server did not restart. Close this window and run launch.cmd again.'; }
    }, 1000);
  })();
</script>
</body>
</html>
